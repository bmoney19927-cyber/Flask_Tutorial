{% extends "base.html" %}
{% block body %}

<div style="max-width: 400px; margin: 50px auto;">
    <h1>Sign Up</h1>

    <form method="post" style="display: flex; flex-direction: column; gap: 15px;">
        <input name="email" type="email" placeholder="Email" required style="padding: 10px; border: 1px solid #ddd; border-radius: 4px;">
        <input name="password" type="password" placeholder="Password" required style="padding: 10px; border: 1px solid #ddd; border-radius: 4px;">
        <button type="submit" style="padding: 10px; background: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; font-weight: bold;">Create Account</button>
    </form>
    
    <p style="margin-top: 20px; text-align: center;">
        Already have an account? <a href="/login" style="color: #007bff; text-decoration: none;">Login here</a>
    </p>
</div>

{% endblock %}
