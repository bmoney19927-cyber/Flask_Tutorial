{% extends "base.html" %}
{% block title %}Create New Boat Listing - Under da sea rentals{% endblock %}

{% block body %}
    <div class="form-container">
        <h1>List Your Boat</h1>
        <p style="text-align: center; color: var(--text-light); margin-bottom: 30px;">
            Fill out the form below to add your boat to our rental fleet
        </p>

        <form method="post">
            <div class="form-group">
                <label for="name">Boat Name *</label>
                <input type="text" name="name" id="name" placeholder="e.g., 'Swift Speedboat'" required>
            </div>

            <div class="form-group">
                <label for="type">Boat Type *</label>
                <input type="text" name="type" id="type" placeholder="e.g., 'Fishing Cruiser', 'Jon Boat'" required>
            </div>

            <div class="form-group">
                <label for="owner_id">Owner ID *</label>
                <input type="number" name="owner_id" id="owner_id" placeholder="Your owner ID" required>
            </div>

            <div class="form-group">
                <label for="rental_price">Daily Rental Price ($) *</label>
                <input type="number" name="rental_price" id="rental_price" step="0.01" placeholder="e.g., 99.99" required>
            </div>

            <button type="submit" class="btn" style="width: 100%; background: var(--primary-color); padding: 12px;">List Boat</button>
        </form>

        <div style="margin-top: 30px; text-align: center;">
            <a href="/boats" style="color: var(--text-light); text-decoration: none;">Cancel</a>
        </div>
    </div>
{% endblock %}
