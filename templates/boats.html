{% extends "base.html" %}
{% block body %}

<h1>Boats</h1>

{% for boat in boats %}
    <div>
        <h3>{{ boat['name'] }}</h3>
        <p>{{ boat['type'] }}</p>
        <p>${{ boat['rental_price'] }}</p>

        <a href="/boat/{{ boat['id'] }}">View</a>
        <a href="/update/{{ boat['id'] }}">Edit</a>

        <form method="post" action="/delete/{{ boat['id'] }}">
            <button type="submit">Delete</button>
        </form>
    </div>
{% endfor %}

{% endblock %}
