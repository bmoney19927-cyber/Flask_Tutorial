{% extends "base.html" %}
{% block title %}Update Boat - Under da sea rentals{% endblock %}

{% block body %}
    <div class="form-container">
        <h1>Update Boat Details</h1>
        <p style="text-align: center; color: var(--text-light); margin-bottom: 30px;">
            Boat ID #{{ boat['id'] }} - Modify the information below
        </p>

        <form method="post">
            <div class="form-group">
                <label for="name">Boat Name *</label>
                <input type="text" name="name" id="name" value="{{ boat['name'] }}" required>
            </div>

            <div class="form-group">
                <label for="type">Boat Type *</label>
                <input type="text" name="type" id="type" value="{{ boat['type'] }}" required>
            </div>

            <div class="form-group">
                <label for="owner_id">Owner ID *</label>
                <input type="number" name="owner_id" id="owner_id" value="{{ boat['owner_id'] }}" required>
            </div>

            <div class="form-group">
                <label for="rental_price">Daily Rental Price ($) *</label>
                <input type="number" name="rental_price" id="rental_price" step="0.01" value="{{ boat['rental_price'] }}" required>
            </div>

            <button type="submit" class="btn" style="width: 100%; background: var(--primary-color); padding: 12px;">Save Changes</button>
        </form>

        <div style="margin-top: 30px; text-align: center;">
            <a href="/boat/{{ boat['id'] }}" style="color: var(--text-light); text-decoration: none;">Cancel</a>
        </div>
    </div>
{% endblock %}
