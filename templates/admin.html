{% extends "base.html" %}
{% block body %}

<h1>Admin Dashboard</h1>

<h2>Users</h2>
{% for user in users %}
    <div>
        <p>{{ user.email }} | Admin: {{ user.is_admin }}</p>
    </div>
{% endfor %}

<hr>

<h2>Boats</h2>
{% for boat in boats %}
    <div>
        <p>{{ boat.name }} - ${{ boat.rental_price }}</p>
    </div>
{% endfor %}

{% endblock %}
